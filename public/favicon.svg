      .stop { fill: #ffd426; }
    }
  </style>
  <rect class="purple" x="3" y="26" width="58" height="12" rx="3" transform="rotate(45 32 32)" />
  <rect class="green" x="3" y="26" width="58" height="12" rx="3" transform="rotate(-45 32 32)" />
  <rect class="red" x="3" y="26" width="58" height="12" rx="3" />
  <rect class="blue" x="26" y="3" width="12" height="58" rx="3" />
  <circle class="stop" cx="32" cy="32" r="10" />
